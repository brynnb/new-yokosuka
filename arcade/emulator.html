<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>New Yokosuka Arcade</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #000;
      }

      html,
      body,
      #game {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      .arcade-error {
        display: grid;
        height: 100%;
        padding: 32px;
        place-items: center;
        color: #e8e2d3;
        text-align: center;
      }

      .arcade-error p {
        max-width: 560px;
        margin: 0;
        line-height: 1.55;
      }

      /* New Yokosuka supplies its own mobile arcade controls outside the
         projected cabinet screen. */
      .ejs_virtualGamepad_parent {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="./emulator.js"></script>
  </body>
</html>
